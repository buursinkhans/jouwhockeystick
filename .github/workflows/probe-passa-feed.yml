# Temporary probe (v2): downloads the PassaHockey feed once and commits a small sample. Branch is deleted afterwards.
name: Probe PassaHockey feed
on:
  push:
    branches: [probe/passa-feed]
    paths: [.github/workflows/probe-passa-feed.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sample feed
        run: |
          curl -sS -m 600 -o "$RUNNER_TEMP/feed.xml" "https://pf.tradetracker.net/?aid=517408&encoding=utf-8&type=xml-v2&fid=2490853&categoryType=2&additionalType=2"
          ls -l "$RUNNER_TEMP/feed.xml"
          mkdir -p probe
          head -c 20000 "$RUNNER_TEMP/feed.xml" > probe/head.xml
          python3 - "$RUNNER_TEMP/feed.xml" <<'PY'
          import sys, json, collections, xml.etree.ElementTree as ET
          path = sys.argv[1]
          tags = collections.Counter(); cats = collections.Counter(); brands = collections.Counter()
          models = {}; samples = []; n = 0; sticks = 0
          def flat(el, prefix=''):
              out = {}
              for c in el:
                  key = prefix + c.tag + (('[' + c.get('name') + ']') if c.get('name') else '')
                  if len(c): out.update(flat(c, key + '/'))
                  else: out[key] = (c.text or '').strip()[:300]
              return out
          for ev, el in ET.iterparse(path):
              if el.tag != 'product': continue
              n += 1
              f = flat(el)
              for k in f: tags[k] += 1
              cat = ' > '.join(v for k, v in f.items() if 'categor' in k.lower())[:150]
              cats[cat] += 1
              name = ' '.join(f.values()).lower()
              if 'stick' in name and 'hockey' in name:
                  sticks += 1
                  b = next((v for k, v in f.items() if 'brand' in k.lower()), '')
                  brands[b] += 1
                  if len(samples) < 6: samples.append(f)
              if f.get('properties/property[subcategories]/value') == 'Sticks':
                  r = parse_qs(urlparse(f['URL']).query).get('r', [''])[0]
                  path = urlparse(r).path
                  m = models.setdefault(path, {'path': path, 'name': f['name'], 'brand': f.get('properties/property[brand]/value',''), 'categoryPath': f.get('properties/property[categoryPath]/value',''), 'category': f.get('categories/category',''), 'gender': f.get('properties/property[gender]/value',''), 'description': f.get('description','')[:300], 'image': f.get('images/image',''), 'variants': []})
                  m['variants'].append({'ean': f.get('properties/property[EAN]/value',''), 'size': f.get('properties/property[size]/value',''), 'color': f.get('properties/property[color]/value',''), 'price': f['price'], 'fromPrice': f.get('properties/property[fromPrice]/value',''), 'stock': f.get('properties/property[stock]/value',''), 'availability': f.get('properties/property[availability]/value','')})
              el.clear()
          json.dump(sorted(models.values(), key=lambda m: m['path']), open('probe/sticks.json', 'w'), ensure_ascii=False, indent=0)
          json.dump({'products': n, 'stickish': sticks, 'fields': tags.most_common(80), 'categories': cats.most_common(60), 'stickBrands': brands.most_common(40), 'samples': samples}, open('probe/summary.json', 'w'), ensure_ascii=False, indent=1)
          PY
          git config user.name probe; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "Probe result" && git push -q origin HEAD:probe/passa-feed
