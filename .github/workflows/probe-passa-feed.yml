# Temporary probe (v5): runs npm run passa:feed from the feature branch on the real feed and commits the report. Branch is deleted afterwards.
name: Probe PassaHockey feed
on:
  push:
    branches: [probe/passa-feed]
    paths: [.github/workflows/probe-passa-feed.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: catalogus/passahockey-feed
          path: feat
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run passa:feed
        run: |
          mkdir -p probe
          cd feat
          ( time npm run --silent passa:feed -- ../probe/passa.json ../probe/passa.md ) > ../probe/run.txt 2>&1 || true
      - name: Commit
        run: |
          git config user.name probe; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "Probe v4 result" && git push -q origin HEAD:probe/passa-feed
