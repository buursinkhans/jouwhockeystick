# Daily publishing (decision log 2026-11-08): every morning, decide whether
# the live site needs a new build, and if so rebuild it through a Netlify
# build hook (secret NETLIFY_BUILD_HOOK). At most one production build a day
# instead of one per push. It builds when at least one of these holds:
#   a. an article or blog post reaches its publication date (publishedAt)
#      since the last live build;
#   b. main has commits that are not live yet and that touch the site (the
#      same path rules as scripts/netlify-ignore.sh);
#   c. a shop price that was still shown on the live build has passed the
#      14-day limit since (MAX_PRICE_AGE_DAYS in src/catalog/offers/sort.ts),
#      so the static pages drop its amount; safety net: the live build is
#      older than 14 days or its date is unknown (scripts/price-expiry.ts);
#   or it was started by hand with "forceer".
# The live commit and build date come from https://jouwhockeystick.nl/version.txt
# (line 1 commit, line 2 build date). After a build it starts IndexNow for the
# pages that changed since the previous live commit. Also keeps one issue
# with the publication schedule up to date.
name: Geplande publicatie

on:
  schedule:
    - cron: '3 4 * * *' # daily 04:03 UTC = 05:03/06:03 Dutch time
  workflow_dispatch:
    inputs:
      forceer:
        description: 'Altijd bouwen (bijvoorbeeld een spoedfix)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write # start IndexNow after a build

concurrency:
  group: publicatie
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # reason b compares the live commit with main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # The schedule check imports the articles, and articles can import the
      # catalog (zod and other packages): without the dependencies it failed on
      # 2026-11-01 and no scheduled article would have gone live.
      - run: npm ci

      - name: Live versie lezen
        id: live
        run: |
          body=$(curl -fsS --max-time 20 https://jouwhockeystick.nl/version.txt || true)
          sha=$(printf '%s\n' "$body" | sed -n 1p | tr -d '[:space:]')
          built=$(printf '%s\n' "$body" | sed -n 2p | tr -d '[:space:]')
          case "$sha" in *[!0-9a-f]* | '') sha='';; esac
          if ! date -d "$built" +%s >/dev/null 2>&1; then built=''; fi
          echo "Live commit: ${sha:-onbekend}; live gebouwd: ${built:-onbekend}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Laatste live-build bepalen
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ steps.live.outputs.built }}
        run: |
          if [ -n "$BUILT" ]; then
            # The build date on the live site (Dutch date).
            since=$(TZ=Europe/Amsterdam date -d "$BUILT" +%F)
            echo "Laatste live-build volgens version.txt: $since"
          else
            # Older builds have no date: the last push to main, or the last
            # time this workflow rebuilt the site, whichever is later.
            head=$(TZ=Europe/Amsterdam date -d "$(git log -1 --format=%cI)" +%F)
            hook=0000-00-00
            for id in $(gh api "repos/${{ github.repository }}/actions/workflows/publicatie.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id'); do
              ran=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" --jq '[.jobs[].steps[] | select(.name == "Netlify opnieuw bouwen" and .conclusion == "success")] | length')
              if [ "$ran" -gt 0 ]; then
                hook=$(TZ=Europe/Amsterdam date -d "$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq .run_started_at)" +%F)
                break
              fi
            done
            since=$head
            if [[ "$hook" > "$since" ]]; then since=$hook; fi
            echo "Geen builddatum live; laatste push naar main: $head; laatste herbouw door deze workflow: $hook"
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Planning controleren
        id: plan
        run: npm run --silent content:schedule -- "${{ steps.since.outputs.since }}" planning.md

      - name: Bouwen of niet?
        id: decide
        env:
          DUE: ${{ steps.plan.outputs.due }}
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          BUILT: ${{ steps.live.outputs.built }}
          FORCE: ${{ inputs.forceer || false }}
        run: |
          head=$(git rev-parse HEAD)
          reasons=()
          [ "$FORCE" = "true" ] && reasons+=("handmatig gestart met forceer")
          [ "$DUE" = "true" ] && reasons+=("a: geplande content staat klaar")
          # b: main differs from live and the difference touches the site.
          # The Netlify ignore script decides on the same path rules
          # (exit 1 = build); an unknown live commit also means build.
          if [ -z "$LIVE_SHA" ]; then
            reasons+=("b: live commit onbekend")
          elif [ "$LIVE_SHA" != "$head" ]; then
            if out=$(env -u INCOMING_HOOK_TITLE -u INCOMING_HOOK_URL -u DAILY_BUILD_ONLY \
                CACHED_COMMIT_REF="$LIVE_SHA" COMMIT_REF="$head" bash scripts/netlify-ignore.sh); then
              echo "Main verschilt van live, maar raakt de site niet: $out"
            else
              why=${out#*(}
              reasons+=("b: main is nieuwer dan live en raakt de site: ${why%)}")
            fi
          fi
          # c: a price on the live pages has expired since the build (or the safety net).
          expiry=$(npm run --silent price:expiry -- "$BUILT")
          expiry_reason=$(printf '%s\n' "$expiry" | sed -n 2p)
          if [ "$(printf '%s\n' "$expiry" | sed -n 1p)" = "build=true" ]; then
            reasons+=("c: $expiry_reason")
          else
            echo "Prijzen: $expiry_reason."
          fi
          today=$(TZ=Europe/Amsterdam date +%F)
          if [ "${#reasons[@]}" -gt 0 ]; then
            line="$today: bouwen. Reden: $(IFS=';'; echo "${reasons[*]}" | sed 's/;/; /g')."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            line="$today: niet gebouwd. Geen geplande content, live is gelijk aan main of het verschil raakt de site niet, en geen prijs verlopen sinds de live build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$line"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          { echo "### Live-zetting"; echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"
          { echo; echo "## Laatste controle"; echo; echo "$line"; } >> planning.md

      - name: Netlify opnieuw bouwen
        if: steps.decide.outputs.build == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret NETLIFY_BUILD_HOOK ontbreekt: maak een build hook in Netlify en zet de URL als repository secret."
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
          echo "Netlify bouwt de site opnieuw."

      - name: IndexNow na de build starten
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.live.outputs.sha }}
          AFTER: ${{ steps.decide.outputs.head }}
        run: |
          # IndexNow waits until version.txt shows this commit, then reports
          # the pages that changed since the previous live commit.
          gh workflow run indexnow.yml --ref main -f before="$BEFORE" -f after="$AFTER"

      - name: Planning in issue zetten
        if: always() && steps.plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create publicatieplanning --color 1D76DB --force
          number=$(gh issue list --label publicatieplanning --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file planning.md
          else
            gh issue create --title "Publicatieplanning" --label publicatieplanning --body-file planning.md
          fi
