# Renders an approved Social-studio video and schedules it on YouTube
# (docs/video.md §10). Normal start: the owner adds the label `publiceren` to an
# approval issue (label `video-klaar`) that the scheduled task "Video-publicatie"
# opened after "Klaarzetten voor YouTube" in the Social-studio. Only the
# repository owner can start it that way: the publish decision is always a human
# action on GitHub, never an agent's. A manual run (Actions → Run workflow) with a
# script is possible too.
#
# Only YouTube: the Short (9:16) and, when not skipped, the 16:9 video, both
# private until their publish moment. Instagram, Facebook and TikTok stay
# manual; the MP4s are attached to the run for that.
name: Video publiceren

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      video:
        description: 'Videoscript uit de Social-studio (JSON, base64)'
        required: true
        type: string
      test:
        description: 'Alleen renderen, niet uploaden'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    # Label start: only the label `publiceren`, only on an approval issue, only when the owner adds it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'publiceren' &&
       github.event.sender.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'video-klaar'))
    # One video at a time. On the job, not the workflow: every other label event also
    # starts this workflow (and is skipped), and must not push a waiting upload out of the queue.
    concurrency:
      group: video-publiceren
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright, Chromium en ffmpeg
        working-directory: video/studio
        timeout-minutes: 10
        # ffmpeg as a fixed static build (npm ffmpeg-static), not via apt: an apt
        # install hung for 30 minutes on 22 October and cost an upload.
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2 ffmpeg-static@5.2.0
          npx playwright install --with-deps chromium
          FF="$(node -e "console.log(require('ffmpeg-static'))")"
          "$FF" -hide_banner -version | head -1
          echo "FFMPEG_PATH=$FF" >> "$GITHUB_ENV"
      - name: Tests
        run: node --test video/studio/*.test.mjs
      - name: Renderen en inplannen
        timeout-minutes: 15
        # The script is data: it goes in through the environment, never into the shell.
        env:
          VIDEO_B64: ${{ inputs.video }}
          DRY_RUN: ${{ inputs.test }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node video/studio/publish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-bestanden
          path: video/studio/out/
          retention-days: 14
          if-no-files-found: ignore
