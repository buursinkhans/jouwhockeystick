# Weekly PassaHockey sync: re-imports the PassaHockey product feed into
# src/catalog/imported/passahockey.ts (prices, stock, new and vanished sticks)
# and opens one pull request when anything changed. Never merges; skips the
# week while an earlier sync PR is still open. See scripts/passa-import.ts.
name: PassaHockey-sync

on:
  schedule:
    - cron: '41 4 * * 3' # Wednesday 04:41 UTC, after the catalog agent on Tuesday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: passa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Nog open sync-PR?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("catalogus/passa-sync-"))] | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" -gt 0 ]; then echo "Er staat nog een sync-PR open; deze week niets nieuws."; fi

      - run: npm ci
        if: steps.open.outputs.open == '0'

      - name: Feed importeren
        if: steps.open.outputs.open == '0'
        run: npm run --silent passa:import -- "$RUNNER_TEMP/import.md"

      # Plutosport shop buttons ('zeker' matches) and the Plutosport sticks that
      # PassaHockey does not sell (src/catalog/imported/plutosport.ts) in the
      # same weekly PR, so they cost no extra deploy (docs/spec/prijsvergelijking.md
      # §4, option A). A failing Awin download leaves both as they were.
      - name: Plutosport-koppelingen en -import bijwerken
        if: steps.open.outputs.open == '0'
        continue-on-error: true
        env:
          AWIN_PLUTOSPORT_FEED_URL: ${{ secrets.AWIN_PLUTOSPORT_FEED_URL }}
        run: npm run --silent plutosport:feed -- "$RUNNER_TEMP/pluto.md" --write-matches --write-import

      # Hockey shoes from both feeds (src/catalog/shoes/imported.ts, decision
      # log 2026-10-31). Needs both feeds: a failing download leaves last
      # week's file as it was (scripts/shoe-import.ts).
      - name: Hockeyschoenen importeren
        if: steps.open.outputs.open == '0'
        continue-on-error: true
        env:
          AWIN_PLUTOSPORT_FEED_URL: ${{ secrets.AWIN_PLUTOSPORT_FEED_URL }}
        run: npm run --silent shoes:import -- "$RUNNER_TEMP/shoes.md"

      # bol.com prices for "Waar te koop", after the imports so new sticks are
      # included. A failing API keeps last week's prices (scripts/bol-prices.ts).
      - name: bol.com-prijzen bijwerken
        if: steps.open.outputs.open == '0'
        continue-on-error: true
        env:
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: npm run --silent bol:prices -- "$RUNNER_TEMP/bol-prices.md"

      - name: Pull request openen
        if: steps.open.outputs.open == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::Pull request openen mislukt bij: $BASH_COMMAND"' ERR
          if [ -z "$(git status --porcelain src/catalog/imported src/catalog/offers src/catalog/shoes/imported.ts)" ]; then echo "Geen wijzigingen."; exit 0; fi
          other=$(git status --porcelain | awk '{print $2}' | grep -v -e '^src/catalog/imported/' -e '^src/catalog/offers/' -e '^src/catalog/shoes/imported.ts$' || true)
          if [ -n "$other" ]; then echo "::error::Wijzigingen buiten src/catalog/imported/, src/catalog/offers/ en src/catalog/shoes/imported.ts: $other"; exit 1; fi
          branch="catalogus/passa-sync-$(date -u +%Y-%m-%d)"
          git config user.name "PassaHockey-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/catalog/imported src/catalog/offers src/catalog/shoes/imported.ts
          git commit -m "Catalogus: PassaHockey-feed bijgewerkt ($(date -u +%F))"
          git push origin "$branch"
          { cat "$RUNNER_TEMP/import.md"; if [ -f "$RUNNER_TEMP/pluto-koppelingen.md" ]; then printf '\n\n'; cat "$RUNNER_TEMP/pluto-koppelingen.md"; fi; if [ -f "$RUNNER_TEMP/bol-prices.md" ]; then printf '\n\n'; cat "$RUNNER_TEMP/bol-prices.md"; fi; if [ -f "$RUNNER_TEMP/shoes.md" ]; then printf '\n\n'; cat "$RUNNER_TEMP/shoes.md"; fi; printf '\n\n_Gemaakt door de wekelijkse PassaHockey-sync. Merge om prijzen, voorraad en nieuwe sticks live te zetten; deze workflow merget nooit zelf._\n'; } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Catalogus: PassaHockey-feed bijgewerkt ($(date -u +%F))" --body-file "$RUNNER_TEMP/body.md"
          # PRs opened with the workflow token do not trigger other workflows; start the quality check explicitly.
          gh workflow run ci.yml --ref "$branch"
