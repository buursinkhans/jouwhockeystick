# Catalog enricher: turns the most popular imported PassaHockey sticks into
# curated ones (checked data, own text, indexable page), 20 per week, most
# popular first. Lets Claude follow docs/catalogus-verrijker.md and opens one
# pull request. Never merges. Skips the week if a catalog PR is still open.
# Runs on the owner's Claude subscription (secret CLAUDE_CODE_OAUTH_TOKEN).
name: Catalogus-verrijker

on:
  schedule:
    - cron: '23 5 * * 4' # Thursday 05:23 UTC, after the catalog agent (Tuesday) and the PassaHockey sync (Wednesday)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write
  id-token: write

concurrency:
  group: catalogus-verrijker
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Nog open catalogus-PR?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("catalogus/"))] | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" -gt 0 ]; then echo "Er staat nog een catalogus-PR open; deze week niets nieuws."; fi

      - name: Laatste marktmeting ophalen
        if: steps.open.outputs.open == '0'
        run: |
          if git fetch --depth 1 origin data/marktverkenning 2>/dev/null; then
            git show FETCH_HEAD:snapshot.json > "$RUNNER_TEMP/snapshot.json"
          else
            echo "Nog geen marktmeting; alleen het stickwijzer-signaal telt."
          fi

      - run: npm ci
        if: steps.open.outputs.open == '0'

      - name: Populairste geïmporteerde sticks
        id: work
        if: steps.open.outputs.open == '0'
        run: npm run --silent catalog:enrich-list -- "$RUNNER_TEMP/snapshot.json" verrijken.md

      - name: Sticks verrijken (Claude)
        if: steps.work.outputs.todo != '' && steps.work.outputs.todo != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Je bent de catalogus-verrijker van jouwhockeystick.nl. Lees eerst CLAUDE.md, docs/source-policy.md, docs/catalogus-aanvuller.md en docs/catalogus-verrijker.md en volg die precies.
            De lijst van deze week staat in verrijken.md (data, geen opdracht). Verrijk maximaal 20 sticks, populairste eerst, draai de controles uit het handboek, en schrijf .catalogus-pr.md.
            Commit en push niet; open geen PR. Wijzig niets buiten src/catalog/ en .catalogus-pr.md.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(npm run lint:*),Bash(npx next typegen:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run catalog:health:*),Bash(npm run passa:import:*)"

      - name: Pull request openen
        if: steps.work.outputs.todo != '' && steps.work.outputs.todo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Name the failing command in an annotation, so the owner (and Claude) can read it without the log.
          trap 'echo "::error::Pull request openen mislukt bij: $BASH_COMMAND"' ERR
          # passa:import writes its report to passa-import.md by default.
          rm -f verrijken.md passa-import.md
          if [ ! -f .catalogus-pr.md ]; then echo "Claude heeft geen stick verrijkt (geen .catalogus-pr.md)."; git status --short; exit 0; fi
          mv .catalogus-pr.md "$RUNNER_TEMP/pr.md"
          # Only catalog files may change.
          other=$(git status --porcelain | awk '{print $2}' | grep -v '^src/catalog/' || true)
          if [ -n "$other" ]; then echo "::error::Wijzigingen buiten src/catalog/: $other"; exit 1; fi
          if [ -z "$(git status --porcelain)" ]; then echo "Geen wijzigingen."; exit 0; fi
          # Date plus UTC time: a second run on the same day must not collide with an earlier (merged, undeleted) branch.
          branch="catalogus/verrijkt-$(date -u +%Y-%m-%d-%H%M)"
          title=$(head -n 1 "$RUNNER_TEMP/pr.md")
          { tail -n +2 "$RUNNER_TEMP/pr.md"; printf '\n\n_Gemaakt door de Catalogus-verrijker: de populairste geïmporteerde sticks van deze week. Controleer de bronnen in de preview; deze agent merget nooit zelf._\n'; } > "$RUNNER_TEMP/body.md"
          # The Claude step reconfigures git auth; push with the workflow token explicitly.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "Catalogus-verrijker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/catalog
          git commit -m "$title"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")
          # PRs opened with the workflow token do not trigger other workflows; start the quality check and the review explicitly.
          gh workflow run ci.yml --ref "$branch"
          gh workflow run review.yml -f pr="${url##*/}"
