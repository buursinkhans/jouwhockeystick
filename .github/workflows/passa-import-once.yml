# TEMPORARY: runs the first PassaHockey import on this branch and commits the
# result here. Removed again before merging.
name: PassaHockey eerste import
on:
  push:
    branches: [catalogus/passahockey-feed]
    paths: [.github/workflows/passa-import-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run --silent passa:import -- docs/passa-import-eerste-run.md
      - run: |
          git config user.name "PassaHockey-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog/imported docs/passa-import-eerste-run.md
          git commit -m "Catalogus: eerste import uit de PassaHockey-feed"
          git push origin HEAD:catalogus/passahockey-feed
