# Quality gate for every pull request (CLAUDE.md, Kwaliteit): lint,
# typecheck, tests and build. Agent PRs are only merged when this is green.
name: Kwaliteitscontrole

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen # generates Next route types such as LayoutProps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
