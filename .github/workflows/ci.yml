# Quality gate for every pull request (CLAUDE.md, Kwaliteit): lint,
# typecheck, tests and build. Agent PRs are only merged when this is green.
name: Kwaliteitscontrole

on:
  pull_request:
  push:
    branches: [main]
  # Started by agent workflows whose pull requests (opened with the workflow
  # token) do not trigger pull_request runs themselves.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen # generates Next route types such as LayoutProps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
