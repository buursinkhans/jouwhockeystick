# Quality gate for every pull request (CLAUDE.md, Kwaliteit): lint,
# typecheck, tests and build. Agent PRs are only merged when this is green.
name: Kwaliteitscontrole

on:
  pull_request:
  push:
    branches: [main]
  # Started by agent workflows whose pull requests (opened with the workflow
  # token) do not trigger pull_request runs themselves.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen # generates Next route types such as LayoutProps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
