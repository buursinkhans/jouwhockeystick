# Daily figures (read-only): PostHog, Search Console and Bing, as one JSON file
# (video/studio/state/dagcijfers.json) with metadata without any figure and all
# figures sealed with VERKOOP_SLEUTEL (security review 2026-11-13), and the
# sales per partner, sealed (verkoop.json), on the branch social-state. The
# routine "Dagbericht" copies them unopened into the Marketingstudio, where the
# owner's browser opens them (docs/marketing/dagbericht.md). Netlify skips
# video/, and only pushes to main start CI.
name: Dagcijfers

on:
  schedule:
    # Twice a day (owner, 2026-11-12): the morning figures and an afternoon update.
    # GitHub cron is UTC; the two afternoon times make sure a run of before 17:00
    # Amsterdam exists in winter and in summer.
    - cron: '31 4 * * *' # 05:31 winter, 06:31 summer
    - cron: '31 14 * * *' # 15:31 winter, 16:31 summer
    - cron: '31 15 * * *' # 16:31 winter, 17:31 summer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shares the branch with the Publiceerder's record (social-state.yml).
  group: social-state
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cijfers ophalen
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          # Seals every figure before it leaves this step.
          VERKOOP_SLEUTEL: ${{ secrets.VERKOOP_SLEUTEL }}
        # Exit code 2 = written, but a source failed: save the file anyway, fail the run afterwards.
        # Exit code 3 = the key is missing: nothing written, nothing saved, the run fails afterwards.
        run: |
          set +e
          npm run --silent metrics:daily -- "$RUNNER_TEMP/dagcijfers.json"
          code=$?
          echo "code=$code" >> "$GITHUB_ENV"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || [ "$code" -eq 3 ]
      - name: Alleen versleuteld?
        # Last check before the public branch: the file has a sealed part and no readable figures.
        run: |
          [ -f "$RUNNER_TEMP/dagcijfers.json" ] || exit 0
          node -e '
            const f = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const plain = ["posthog", "google", "bing", "detail"].filter((k) => k in f);
            if (f.versie !== 3 || !f.versleuteld || f.versleuteld.alg !== "PBKDF2-SHA256/AES-256-GCM" || plain.length) {
              console.error("dagcijfers.json is niet (alleen) versleuteld; niet opgeslagen."); process.exit(1);
            }' "$RUNNER_TEMP/dagcijfers.json"
      - name: Verkoop ophalen (versleuteld)
        # Amounts per partner, sealed with VERKOOP_SLEUTEL before they leave this step
        # (docs/marketing/dagbericht.md, Verkoop). Without the key: nothing is written.
        env:
          VERKOOP_SLEUTEL: ${{ secrets.VERKOOP_SLEUTEL }}
          BOL_AFFILIATE_CLIENT_ID: ${{ secrets.BOL_AFFILIATE_CLIENT_ID }}
          BOL_AFFILIATE_CLIENT_SECRET: ${{ secrets.BOL_AFFILIATE_CLIENT_SECRET }}
          TRADETRACKER_CUSTOMER_ID: ${{ secrets.TRADETRACKER_CUSTOMER_ID }}
          TRADETRACKER_PASSPHRASE: ${{ secrets.TRADETRACKER_PASSPHRASE }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          DAISYCON_EXPORT_URL: ${{ secrets.DAISYCON_EXPORT_URL }}
        run: |
          set +e
          npm run --silent sales:daily -- "$RUNNER_TEMP/verkoop.json"
          sales=$?
          echo "sales=$sales" >> "$GITHUB_ENV"
          [ "$sales" -eq 0 ] || [ "$sales" -eq 2 ] || [ "$sales" -eq 3 ]
      - name: Op social-state zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin social-state; then git checkout -q -B social-state origin/social-state; else git checkout -q -b social-state; fi
          mkdir -p video/studio/state
          for attempt in 1 2 3; do
            if [ -f "$RUNNER_TEMP/dagcijfers.json" ]; then
              cp "$RUNNER_TEMP/dagcijfers.json" video/studio/state/dagcijfers.json
              git add video/studio/state/dagcijfers.json
            fi
            # Since 2026-11-14 everything is in dagcijfers.json; the separate detail file goes.
            if [ -f video/studio/state/dagcijfers-detail.json ]; then git rm -q video/studio/state/dagcijfers-detail.json; fi
            if [ -f "$RUNNER_TEMP/verkoop.json" ]; then
              cp "$RUNNER_TEMP/verkoop.json" video/studio/state/verkoop.json
              git add video/studio/state/verkoop.json
            fi
            git diff --cached --quiet && { echo "Geen wijziging."; break; }
            git commit -q -m "Dagcijfers $(date -u +%F)"
            git push -q origin social-state && break
            git fetch -q origin social-state && git reset -q --hard origin/social-state
            [ "$attempt" -eq 3 ] && { echo "Schrijven lukte niet na 3 pogingen." >&2; exit 1; }
          done
      - name: Bron mislukt?
        if: env.code == '2' || env.code == '3' || env.sales == '2'
        run: |
          if [ "$code" = "3" ]; then echo "VERKOOP_SLEUTEL ontbreekt: geen dagcijfers geschreven." >&2; exit 1; fi
          echo "Eén of meer bronnen gaven geen cijfers; zie de stap 'Cijfers ophalen'. Het bestand staat er wel." >&2
          exit 1
