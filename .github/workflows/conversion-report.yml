# Weekly conversion report (read-only): stickwijzer funnel, drop-off per
# question, clicks to bol.com and frustration signals from PostHog (EU),
# written to one GitHub issue. Never changes code, content or the live site.
name: Conversie-rapport

on:
  schedule:
    - cron: '53 5 * * 1' # Mondays 05:53 UTC, before the Orchestrator
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci # the stickwijzer question order uses zod
      # TIJDELIJK (validatie PR #116): alleen de queries, geen issue. Wordt vóór de merge teruggezet.
      - name: Queries valideren
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          VALIDATE_ONLY: '1'
        run: npm run --silent analytics:report
