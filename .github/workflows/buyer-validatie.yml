# One-off research run (Buyer Intelligence fase 1.5). Read-only towards
# PostHog and Search Console: aggregated counts only. Runs on pushes to the
# research branch and writes the result back to that branch as a Markdown
# file. This branch is never merged; it does not touch the site.
name: Buyer-validatie (onderzoek)

on:
  push:
    branches: ['research/buyer-validatie']
    paths: ['.github/research/**', '.github/workflows/buyer-validatie.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verkoop over de hele looptijd (alleen aantallen)
        env:
          BOL_AFFILIATE_CLIENT_ID: ${{ secrets.BOL_AFFILIATE_CLIENT_ID }}
          BOL_AFFILIATE_CLIENT_SECRET: ${{ secrets.BOL_AFFILIATE_CLIENT_SECRET }}
          TRADETRACKER_CUSTOMER_ID: ${{ secrets.TRADETRACKER_CUSTOMER_ID }}
          TRADETRACKER_PASSPHRASE: ${{ secrets.TRADETRACKER_PASSPHRASE }}
        run: |
          mkdir -p docs/research
          y=$(date -u -d yesterday +%F)
          sed "s|^const { current, previous } = periods(new Date());|const current = { from: '2026-09-01', to: '$y' }; const previous = { from: '2026-08-01', to: '2026-08-31' };|" scripts/sales-report.ts > scripts/sales-report-all.ts
          grep -q "from: '2026-09-01'" scripts/sales-report-all.ts || echo "PERIODE NIET VERVANGEN" > docs/research/verkoop-looptijd.md
          node --experimental-strip-types --no-warnings --import ./scripts/ts-register.mjs scripts/sales-report-all.ts >> docs/research/verkoop-looptijd.md 2> error.log \
            || { echo "## Script mislukt" >> docs/research/verkoop-looptijd.md; head -20 error.log | sed -e 's/^/    /' >> docs/research/verkoop-looptijd.md; }
      - name: Resultaat terugzetten op de onderzoeksbranch
        run: |
          git config user.name "buyer-validatie[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/verkoop-looptijd.md
          git commit -m "Onderzoeksdata buyer-validatie $(date -u +%F)" || exit 0
          git push
