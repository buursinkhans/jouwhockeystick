# Monthly Instagram token refresh: long-lived tokens expire after 60 days, so
# this renews the token in Netlify every month and redeploys the site. The
# token is never printed. If it fails (for example because the token already
# expired), GitHub e-mails the owner. See scripts/instagram-token-refresh.ts.
name: Instagram-token verversen

on:
  schedule:
    - cron: '17 6 1 * *' # 1st of every month, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Token verversen
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npm run --silent instagram:refresh
